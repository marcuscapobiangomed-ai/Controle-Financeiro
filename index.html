<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CapitalControl - Centro Financeiro & Investimentos</title>
    <meta name="description" content="Centro de controle para finanças pessoais: gestão completa de receitas, despesas, fluxo de caixa e carteira de investimentos." />
    <meta property="og:title" content="CapitalControl - Centro Financeiro & Investimentos" />
    <meta property="og:description" content="Centro de controle para finanças pessoais: gestão completa de receitas, despesas, fluxo de caixa e carteira de investimentos." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      // Safe iframe polyfills for alert/confirm/open to avoid sandbox SecurityError
      if (typeof window !== 'undefined') {
        window.alert = function (msg) {
          console.warn('[CapitalControl Alert]:', msg);
        };
        window.confirm = function (msg) {
          console.warn('[CapitalControl Confirm]:', msg);
          return true;
        };
      }

      // Ignore WebSocket and Vite HMR errors in iframe environment per platform guidelines
      window.addEventListener('unhandledrejection', function (e) {
        var msg = e && e.reason ? (e.reason.message || String(e.reason)) : '';
        var stack = e && e.reason && e.reason.stack ? String(e.reason.stack) : '';
        if (
          msg.indexOf('WebSocket') !== -1 ||
          stack.indexOf('WebSocket') !== -1 ||
          stack.indexOf('@vite/client') !== -1 ||
          msg.indexOf('@vite/client') !== -1
        ) {
          e.preventDefault();
        }
      });
      window.addEventListener('error', function (e) {
        var msg = e ? (e.message || '') : '';
        var filename = e ? (e.filename || '') : '';
        if (
          msg.indexOf('WebSocket') !== -1 ||
          filename.indexOf('@vite/client') !== -1 ||
          msg.indexOf('@vite/client') !== -1
        ) {
          e.preventDefault();
        }
      });
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased font-sans min-h-screen selection:bg-emerald-500/30 selection:text-emerald-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
